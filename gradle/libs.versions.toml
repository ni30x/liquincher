[versions]
#jetbrains
kotlin = "2.2.10"
#KSP
ksp = "2.3.5"
#Detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
#Room
room = "2.8.5"
#Fossify
commons = "7.1.3"
#Gradle
gradlePlugins-agp = "9.5.0"
#build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
#liquid glass
backdrop = "2.0.1"
#Compose
compose-bom = "2024.10.01"
[libraries]
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
#Compose (versions from BOM)
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose" }
androidx-window-core = { module = "androidx.window:window-core" }
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
#Fossify
fossify-commons = { module = "org.fossify:commons", version.ref = "commons" }
#liquid glass
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
[bundles]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
compose = [
    "androidx-compose-ui",
    "androidx-compose-material3",
    "androidx-compose-foundation",
    "androidx-compose-runtime",
    "androidx-compose-animation",
    "androidx-activity-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-window-core",
]
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
