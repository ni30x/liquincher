name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build only the FOSS flavor (main distribution, no Google Play deps)
      - name: Build debug APK (foss)
        run: ./gradlew assembleFossDebug --stacktrace

      # Upload foss flavor
      - name: Upload foss debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-debug
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          compression-level: 6
