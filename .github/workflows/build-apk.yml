name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build BOTH flavors explicitly instead of the bare `assembleDebug`
      # aggregate task. This is what was already happening implicitly,
      # we're just making the task names (and therefore the output paths)
      # explicit so the next step knows where to look.
      - name: Build debug APKs (foss + gplay)
        run: ./gradlew assembleFossDebug assembleGplayDebug --stacktrace

      # Upload foss flavor
      - name: Upload foss debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-foss-debug
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          compression-level: 6

      # Upload gplay flavor
      - name: Upload gplay debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-gplay-debug
          path: app/build/outputs/apk/gplay/debug/app-gplay-debug.apk
          if-no-files-found: error
          compression-level: 6
